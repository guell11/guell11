  <text x="173" y="136" text-anchor="middle" fill="#f0f0f2">01 / MODEL</text>
  <text x="439" y="136" text-anchor="middle" fill="#f0f0f2">02 / INFERENCE</text>
  <text x="705" y="136" text-anchor="middle" fill="#f0f0f2">03 / SYSTEM</text>
