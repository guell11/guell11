<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b0c0f"/>
    <stop offset="1" stop-color="#060607"/>
  </linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#111319"/>
    <stop offset="1" stop-color="#0a0b0e"/>
  </linearGradient>
  <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(920 110) rotate(90) scale(220)">
    <stop stop-color="#7dd3fc" stop-opacity=".10"/>
    <stop offset=".45" stop-color="#a78bfa" stop-opacity=".045"/>
    <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#7dd3fc" stop-opacity=".95"/>
    <stop offset=".52" stop-color="#a78bfa" stop-opacity=".82"/>
    <stop offset="1" stop-color="#f472b6" stop-opacity=".75"/>
  </linearGradient>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="16"/>
  </filter>
</defs>


<rect width="1200" height="340" rx="30" fill="url(#bg)"/>
<rect x="1" y="1" width="1198" height="338" rx="29" fill="none" stroke="#ffffff" stroke-opacity=".10"/>
<rect width="1200" height="340" rx="30" fill="url(#glow)"/>
<g stroke="#fff" stroke-opacity=".022">
  <path d="M0 60H1200"/><path d="M0 120H1200"/><path d="M0 180H1200"/><path d="M0 240H1200"/><path d="M0 300H1200"/>
  <path d="M60 0V340"/><path d="M120 0V340"/><path d="M180 0V340"/><path d="M240 0V340"/><path d="M300 0V340"/><path d="M360 0V340"/><path d="M420 0V340"/><path d="M480 0V340"/><path d="M540 0V340"/><path d="M600 0V340"/><path d="M660 0V340"/><path d="M720 0V340"/><path d="M780 0V340"/><path d="M840 0V340"/><path d="M900 0V340"/><path d="M960 0V340"/><path d="M1020 0V340"/><path d="M1080 0V340"/><path d="M1140 0V340"/>
</g>

<text x="48" y="48" fill="#686a73" font-family="ui-monospace,Consolas,monospace" font-size="11" letter-spacing="2">05 / PRINCIPLES</text>
<line x1="48" y1="68" x2="1152" y2="68" stroke="#fff" stroke-opacity=".08"/>

<g>
<rect x="48" y="100" width="346" height="188" rx="22" fill="url(#panel)" stroke="#fff" stroke-opacity=".09"/>
<rect x="427" y="100" width="346" height="188" rx="22" fill="url(#panel)" stroke="#fff" stroke-opacity=".09"/>
<rect x="806" y="100" width="346" height="188" rx="22" fill="url(#panel)" stroke="#fff" stroke-opacity=".09"/>
</g>

<g font-family="ui-monospace,Consolas,monospace" font-size="9" fill="#777982">
  <text x="72" y="128">01 / RESEARCH FIRST</text>
  <text x="451" y="128">02 / BUILD THE SYSTEM</text>
  <text x="830" y="128">03 / LOCAL FIRST</text>
</g>

<g font-family="Inter,Segoe UI,Arial,sans-serif">
  <text x="72" y="174" fill="#f2f2f4" font-size="21" font-weight="700">Understand before claiming.</text>
  <text x="451" y="174" fill="#f2f2f4" font-size="21" font-weight="700">The model is one layer.</text>
  <text x="830" y="174" fill="#f2f2f4" font-size="21" font-weight="700">Control matters.</text>

  <text x="72" y="214" fill="#94959c" font-size="14">Baselines, ablations and</text>
  <text x="72" y="238" fill="#94959c" font-size="14">reproducibility matter.</text>

  <text x="451" y="214" fill="#94959c" font-size="14">Inference, memory, interfaces,</text>
  <text x="451" y="238" fill="#94959c" font-size="14">storage and deployment matter.</text>

  <text x="830" y="214" fill="#94959c" font-size="14">Whenever practical, I prefer</text>
  <text x="830" y="238" fill="#94959c" font-size="14">systems users can run locally.</text>
</g>

<g stroke="url(#accent)" stroke-width="2">
  <path d="M72 266h84"/><path d="M451 266h84"/><path d="M830 266h84"/>
</g>
</svg>