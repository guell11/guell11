<text x="48" y="48" fill="#686a73" font-family="ui-monospace,Consolas,monospace" font-size="11" letter-spacing="2">04 / HOW I BUILD</text>
<line x1="48" y1="68" x2="1152" y2="68" stroke="#fff" stroke-opacity=".08"/>

<g font-family="ui-monospace,Consolas,monospace" font-size="10">
  <rect x="70" y="104" width="206" height="54" rx="16" fill="url(#panel)" stroke="#fff" stroke-opacity=".10"/>
