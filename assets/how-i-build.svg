<g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#93949b">
  <text x="173" y="198" text-anchor="middle">architecture · fine-tuning</text>
  <text x="173" y="220" text-anchor="middle">latent compute · multimodal</text>

  <text x="439" y="198" text-anchor="middle">quantization · local deploy</text>
